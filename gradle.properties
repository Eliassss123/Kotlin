# Gradle properties — configuración del build system
# Documentación: https://docs.gradle.org/current/userguide/build_environment.html

# ── Rendimiento ───────────────────────────────────────────────────────────────
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# ── Android ───────────────────────────────────────────────────────────────────
android.useAndroidX=true
android.enableJetifier=false

# ── Kotlin ────────────────────────────────────────────────────────────────────
kotlin.code.style=official

# ── Compose ───────────────────────────────────────────────────────────────────
# Necesario para la generación de código de Compose Compiler Metrics (opcional)
# android.enableComposeCompilerMetrics=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
