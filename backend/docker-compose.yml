services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in backend/.env}
      MYSQL_DATABASE: induztek_identity
      MYSQL_USER: induztek_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in backend/.env}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

  service-registry:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: service-registry
    ports:
      - "8761:8761"

  roles-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: roles-service
    environment:
      SPRING_DATASOURCE_URL: "${ROLES_DATABASE_URL:-jdbc:mysql://mysql:3306/induztek_roles?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in backend/.env}
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_started

  notifications-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: notifications-service
    environment:
      EUREKA_URL: http://service-registry:8761/eureka/
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@induztek.local}
    depends_on:
      service-registry:
        condition: service_started

  identity-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: identity-service
    environment:
      SPRING_DATASOURCE_URL: "${IDENTITY_DATABASE_URL:-jdbc:mysql://mysql:3306/induztek_identity?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in backend/.env}
      EUREKA_URL: http://service-registry:8761/eureka/
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      REGISTRATION_REQUIRE_APPROVAL: ${REGISTRATION_REQUIRE_APPROVAL:-true}
      UPLOAD_DIR: /app/upload
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://10.0.2.2:8080}
    volumes:
      - uploads:/app/upload
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_started
      roles-service:
        condition: service_started
      notifications-service:
        condition: service_started

  catalog-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: catalog-service
    environment:
      SPRING_DATASOURCE_URL: "${CATALOG_DATABASE_URL:-jdbc:mysql://mysql:3306/induztek_catalog?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in backend/.env}
      EUREKA_URL: http://service-registry:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_started

  operations-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: operations-service
    environment:
      SPRING_DATASOURCE_URL: "${OPERATIONS_DATABASE_URL:-jdbc:mysql://mysql:3306/induztek_operations?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in backend/.env}
      EUREKA_URL: http://service-registry:8761/eureka/
      UPLOAD_DIR: /app/upload
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://10.0.2.2:8080}
    volumes:
      - uploads:/app/upload
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_started
      catalog-service:
        condition: service_started

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: api-gateway
    environment:
      SERVER_PORT: 8080
      EUREKA_URL: http://service-registry:8761/eureka/
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      service-registry:
        condition: service_started

volumes:
  mysql_data:
  uploads:
